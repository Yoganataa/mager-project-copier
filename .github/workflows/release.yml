name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - name: Linux (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: mager
          - name: macOS (x86_64)
            os: macos-latest
            target: x86_64-apple-darwin
            bin: mager
          - name: macOS (ARM64)
            os: macos-latest
            target: aarch64-apple-darwin
            bin: mager
          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: mager.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build TUI (Release)
        run: cargo build --release --target ${{ matrix.platform.target }} --bin mager_tui

      - name: Rename Binary
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.platform.target }}/release/mager_tui${{ matrix.platform.os == 'windows-latest' && '.exe' || '' }} dist/${{ matrix.platform.bin }}-${{ matrix.platform.target }}${{ matrix.platform.os == 'windows-latest' && '.exe' || '' }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mager-${{ matrix.platform.target }}
          path: dist/*

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
